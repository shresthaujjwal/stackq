name: stackq
description: Restack stacked PRs and feed them through GitHub's merge queue, one after another.
branding:
  icon: layers
  color: blue

inputs:
  token:
    description: >
      Token that can push branches, edit PRs and enqueue them. Use a GitHub App
      token or a PAT: pushes made with GITHUB_TOKEN do not trigger your CI, so
      a restacked PR would never get the checks the queue needs.
    required: true
  command:
    description: >
      The stackq command to run: `ci` (the default; reads the GitHub event),
      or `split`, `push`, `sync`, `status`, `land`, `revert`, `schedule`.
      For anything but `ci`, check out the branch you want to act on first,
      with `fetch-depth: 0`.
    required: false
    default: ci
  args:
    description: >
      Extra arguments for the command, split on spaces (quotes are not
      interpreted), e.g. `--no-enqueue` for `ci` or `--max-lines 300` for `split`.
    required: false
    default: ""
  version:
    description: >
      Which stackq release to run: `latest` (the default; or the tag the
      workflow pins, such as `@v0.3.1`), a tag like `v0.3.1`, or `source` to
      build the action's own checkout. A failed download or checksum falls
      back to building from source.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: stable
        cache: false

    - name: Get stackq
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        os=linux; arch=amd64
        case "$RUNNER_OS" in macOS) os=darwin ;; Windows) os=windows ;; esac
        case "$RUNNER_ARCH" in ARM64) arch=arm64 ;; esac
        ext=""; [ "$os" = windows ] && ext=.exe
        asset="stackq_${os}_${arch}${ext}"
        bin="$RUNNER_TEMP/stackq$ext"

        tag="$VERSION"
        if [ "$tag" = latest ] && [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then tag="$ACTION_REF"; fi
        if [ "$tag" = latest ]; then
          base="https://github.com/$ACTION_REPO/releases/latest/download"
        else
          base="https://github.com/$ACTION_REPO/releases/download/$tag"
        fi

        if [ "$VERSION" != source ] \
          && curl -fsSL --retry 3 -o "$bin" "$base/$asset" \
          && curl -fsSL --retry 3 -o "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt" \
          && (cd "$RUNNER_TEMP" && grep " $asset\$" checksums.txt | sed "s# $asset# stackq$ext#" | sha256sum -c --quiet -); then
          chmod +x "$bin"
          echo "stackq: using the released binary ($tag, $asset)"
        else
          [ "$VERSION" = source ] || echo "::warning::stackq: no verified release binary for '$tag'; building from source"
          (cd "$ACTION_PATH" && go build -o "$bin" ./cmd/stackq)
        fi
        "$bin" version

    - name: Run stackq
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        STACKQ_COMMAND: ${{ inputs.command }}
        STACKQ_ARGS: ${{ inputs.args }}
      run: |
        git config user.name  >/dev/null || git config user.name  "stackq[bot]"
        git config user.email >/dev/null || git config user.email "stackq-bot@users.noreply.github.com"
        # The command and args are split on spaces on purpose; never expand globs.
        set -f
        # shellcheck disable=SC2086
        "$RUNNER_TEMP/stackq" $STACKQ_COMMAND $STACKQ_ARGS
