# Actions are pinned to commit SHAs (a tag can be moved to different code); Go modules are checked too.
# Dependabot opens a PR when a newer release exists, with the changelog.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
