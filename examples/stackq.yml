# Copy to .github/workflows/stackq.yml in the repository that uses stacks.
name: stackq

on:
  pull_request:
    # closed+merged: restack / finish an atomic landing, then refill the queue
    # dequeued:      the queue kicked a PR out; pause it and say why
    # labeled:       a PR joined the priority pool (stackq:queue)
    types: [closed, dequeued, labeled]
  pull_request_review:
    types: [submitted] # an approval can make a pool PR eligible
  workflow_run:
    workflows: [ci] # the name of your CI workflow: a green run can make a pool PR eligible
    types: [completed]
  schedule:
    - cron: "*/5 * * * *" # safety net for missed events; drop it if you don't use priority
  workflow_dispatch:
    inputs:
      command:
        description: What to do
        type: choice
        options: [land, after-merge, revert, schedule]
        default: land
      pr:
        description: PR number (not needed for schedule)
        required: false
        default: "0"

permissions:
  contents: write
  pull-requests: write

# One stack step at a time, never cancelled halfway through a push.
concurrency:
  group: stackq
  cancel-in-progress: false

jobs:
  stackq:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'stackq:queue') ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled' &&
       (github.event.action == 'dequeued' || github.event.pull_request.merged == true))
    runs-on: ubuntu-latest
    steps:
      # A GitHub App token, so pushes trigger your CI and the App can jump the queue.
      # (Or skip this step and use a fine-grained PAT: secrets.STACKQ_TOKEN.)
      - id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.STACKQ_APP_ID }}
          private-key: ${{ secrets.STACKQ_APP_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0 # rebasing needs history; on huge repos add `filter: blob:none`
          token: ${{ steps.token.outputs.token }}

      - uses: YOUR_ORG/stackq@v0 # wherever you host this repo
        with:
          token: ${{ steps.token.outputs.token }}
