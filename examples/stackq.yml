# Copy to .github/workflows/stackq.yml in the repository that uses stacks.
# Your CI (examples/ci-merge-group.yml) needs merge_group and workflow_dispatch.
#
# Token: add a STACKQ_TOKEN secret (fine-grained PAT, or a GitHub App token you
# mint with actions/create-github-app-token) at the repo or org level. Pushes
# made with it trigger your CI, and an App can jump the queue. Without one
# this uses the built-in token, and the last step starts CI on stack branches.
name: stackq

on:
  pull_request:
    # closed+merged: restack / finish an atomic landing, then refill the queue
    # dequeued:      the queue kicked a PR out; pause it and say why
    # labeled:       a PR joined the priority pool (stackq:queue)
    types: [closed, dequeued, labeled]
  pull_request_review:
    types: [submitted] # an approval can make a pool PR or a whole stack ready
  workflow_run:
    workflows: [ci] # the name of your CI workflow: a green run can make a pool PR or a stack ready
    types: [completed]
  # A safety net, not a clock. GitHub runs schedules late or skips them when it
  # is busy (in a quiet test repo this ran about every two hours, not every
  # five minutes). Every step above is started by an event; this only catches
  # what a lost event left behind. Drop it if you use neither priority nor
  # autoLand.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: What to do
        type: choice
        options: [land, after-merge, revert, schedule, tick, doctor, gc]
        default: land
      pr:
        description: PR number (not needed for schedule, tick, doctor or gc)
        required: false
        default: "0"

permissions:
  contents: write
  pull-requests: write
  actions: write # to start CI on stack branches
  # To read CI results. A permission that is not listed is set to none, and
  # without these two every PR looks as if it had no checks at all: the gate for
  # failing or pending checks sees nothing, and auto-land waits forever.
  checks: read
  statuses: read

# One stack step at a time, never cancelled halfway through a push.
#
# GitHub keeps one running and one pending run per group, and a newer pending
# run replaces the older one, even if its job is skipped by the `if` below. This
# workflow starts on every label and every PR close, most of which do nothing, so
# those runs get a group of their own: they must not take the pending slot of a
# run that has work to do. (A real run replaced by a newer real run is fine: every
# run looks at all stacks. `dequeued` is also caught on the next tick.)
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
         github.event_name == 'schedule' ||
         github.event_name == 'pull_request_review' ||
         github.event_name == 'workflow_run' ||
         (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'stackq:queue') ||
         (github.event_name == 'pull_request' && github.event.action != 'labeled' &&
          (github.event.action == 'dequeued' || github.event.pull_request.merged == true)))
        && 'stackq' || format('stackq-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  stackq:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'stackq:queue') ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled' &&
       (github.event.action == 'dequeued' || github.event.pull_request.merged == true))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0 # rebasing needs history; on huge repos add `filter: blob:none`
          token: ${{ secrets.STACKQ_TOKEN || github.token }}
          # stackq gives git the token for the one command that needs it, so it
          # is not stored in .git/config where any later command could read it.
          persist-credentials: false

      # Runs the newest stackq release. To pin one, add `version: v0.1.1`
      # (or use `@v0.1.1`); the release notes list what changed.
      - uses: YOUR_ORG/stackq@v0
        with:
          token: ${{ secrets.STACKQ_TOKEN || github.token }}

      # Pushes made with the built-in token do not start pull_request
      # workflows. Start CI on any stack branch whose current commit has no run that
      # actually ran (a run waiting for approval does not count).
      # Harmless when a PAT or an App token is used.
      - name: Start CI on stack branches
        env:
          GH_TOKEN: ${{ secrets.STACKQ_TOKEN || github.token }}
        run: |
          gh pr list --state open --json headRefName,headRefOid \
            --jq '.[] | select(.headRefName | startswith("stack/")) | "\(.headRefName) \(.headRefOid)"' |
          while read -r branch sha; do
            # A run waiting for approval (action_required) has not run any checks.
            seen=$(gh run list --workflow ci.yml --branch "$branch" --json headSha,conclusion --jq ".[] | select(.headSha == \"$sha\" and .conclusion != \"action_required\") | .headSha" | head -n1)
            if [ -z "$seen" ]; then
              gh workflow run ci.yml --ref "$branch" || true
            fi
          done
