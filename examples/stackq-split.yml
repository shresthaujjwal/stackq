# Copy to .github/workflows/stackq-split.yml.
#
# Label a big PR `stackq:split` and this splits its branch into a stack of
# small PRs, links them from the original PR, closes the original, and removes
# the label. You can also run it by hand from the Actions tab with a branch name.
# Nobody needs a local token or gh login.
#
# Create the label once (Issues > Labels > New label: stackq:split).
#
# Token: add a STACKQ_TOKEN secret (fine-grained PAT or App token with contents
# and pull-requests write) at the repo or org level. Without it the workflow
# falls back to the built-in token, which needs
#   Settings > Actions > General > "Allow GitHub Actions to create and approve
#   pull requests"
# and does not trigger CI on the pushed branches (the last step starts it).
#
# PRs from forks are ignored: they get a read-only token.
name: stackq split

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to split into a stack
        required: true
      max_lines:
        description: Changed-line budget per slice
        default: "400"
      draft:
        description: Open the PRs as drafts
        type: boolean
        default: false
      close_source:
        description: Close the original PR once the stack exists
        type: boolean
        default: true
      force:
        description: Replace an existing stack of the same name
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

# Share stackq's group so a split never overlaps a restack.
concurrency:
  group: stackq
  cancel-in-progress: false

jobs:
  split:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'stackq:split' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.event.pull_request.head.ref, 'stack/'))
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch || github.event.pull_request.head.ref }}
      # 0 when started by hand: stackq then looks up the branch's open PR.
      SOURCE_PR: ${{ github.event.pull_request.number || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0 # the planner needs the merge base and history
          token: ${{ secrets.STACKQ_TOKEN || github.token }}
          # The build check runs commands from .stackq.json on this branch. Keep the
          # token out of .git/config; stackq hands it to git only when it fetches
          # or pushes.
          persist-credentials: false

      # Runs the newest stackq release; add `version: v0.1.1` to pin one.
      # The slice build check comes from "check" in .stackq.json.
      - name: Split
        uses: YOUR_ORG/stackq@v0
        with:
          token: ${{ secrets.STACKQ_TOKEN || github.token }}
          command: split
          args: --max-lines ${{ inputs.max_lines || '400' }} --from-pr ${{ env.SOURCE_PR }} ${{ inputs.force && '--force' || '' }}

      - name: Push and open the PRs
        uses: YOUR_ORG/stackq@v0
        with:
          token: ${{ secrets.STACKQ_TOKEN || github.token }}
          command: push
          args: --from-pr ${{ env.SOURCE_PR }} ${{ inputs.draft && '--draft' || '' }} ${{ (github.event_name == 'pull_request' || inputs.close_source) && '--close-source' || '' }}

      # Pushes made with the built-in token do not start pull_request
      # workflows. Start CI on any stack branch whose current commit has no run that
      # actually ran (a run waiting for approval does not count).
      # Harmless when a PAT or an App token is used.
      - name: Start CI on the stack branches
        env:
          GH_TOKEN: ${{ secrets.STACKQ_TOKEN || github.token }}
        run: |
          gh pr list --state open --json headRefName,headRefOid \
            --jq '.[] | select(.headRefName | startswith("stack/")) | "\(.headRefName) \(.headRefOid)"' |
          while read -r branch sha; do
            # A run waiting for approval (action_required) has not run any checks.
            seen=$(gh run list --workflow ci.yml --branch "$branch" --json headSha,conclusion --jq ".[] | select(.headSha == \"$sha\" and .conclusion != \"action_required\") | .headSha" | head -n1)
            if [ -z "$seen" ]; then
              gh workflow run ci.yml --ref "$branch" || true
            fi
          done

      # Take the label off so applying it again retries.
      - name: Remove the label
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.STACKQ_TOKEN || github.token }}
        run: gh pr edit "$SOURCE_PR" --remove-label stackq:split || true

      - name: Say so on the PR if it failed
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.STACKQ_TOKEN || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$SOURCE_PR" --body "stackq could not split this PR. See the run: $RUN_URL

          Fix the cause and add the \`stackq:split\` label again. If a stack of this name already exists, run the \`stackq split\` workflow by hand with *force* ticked."
