# Your CI needs four triggers for stackq. Replace the steps with your build
# and tests.
name: ci

on:
  # Check what actually lands. A merge from the queue or with the built-in
  # token starts no pull_request run, and a rebased head can differ from the
  # commit that was tested. Change `main` if your default branch is named
  # differently.
  push:
    branches: [main]
  # No branch filter: stack parts target stack/** branches, and atomic
  # landing needs their checks. (Or use branches: [main, 'stack/**'].)
  pull_request:
  # The merge queue runs this workflow on its temporary branches; without it
  # queued PRs are never checked and the queue stalls.
  merge_group:
  # Lets the stackq workflows start CI on branches they pushed with the
  # built-in token (pushes made with GITHUB_TOKEN do not trigger pull_request
  # runs). Not needed if you give stackq a PAT or an App token.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test -race ./...
